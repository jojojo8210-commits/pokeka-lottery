name: validate-data
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'scripts/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pyyaml
      - run: python scripts/validate.py
