<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケカ抽選・予約情報まとめ</title>
<meta name="description" content="全国の店舗の公式告知から集めた、ポケモンカードの抽選・予約情報を締切が近い順に一覧できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F8;
  --surface:#FFFFFF;
  --ink:#12203A;
  --muted:#5B6B82;
  --line:#D7DEE8;
  --action:#0A5CB8;
  --soon:#D9560B;
  --urgent:#C8281E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.6;color-scheme:light;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:28px 0 16px}
h1{margin:0;font-size:clamp(26px,6vw,34px);font-weight:900;line-height:1.25}
.lead{margin:8px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:10px;font-size:13px;color:var(--muted)}
.notice{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--soon);background:#FFF4EC;border-radius:6px;font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,245,248,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:8px;font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;min-height:32px}
.opts input[type=checkbox]{width:18px;height:18px}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.count{margin:14px 0 4px;font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:92px 1fr;gap:0 14px;padding:16px 0 16px 12px;border-bottom:1px solid var(--line);border-left:4px solid var(--line)}
.time .lab{font-size:11px;color:var(--muted)}
.time .big{font-size:34px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.time .unit{font-size:14px;font-weight:700;margin-left:2px}
.time .sub{font-size:12px;color:var(--muted)}
.row.urgent{border-left-color:var(--urgent)}
.row.urgent .big{color:var(--urgent)}
.row.soon{border-left-color:var(--soon)}
.row.soon .big{color:var(--soon)}
.row.upcoming{border-left-color:var(--action)}
.row.upcoming .big{color:var(--action)}
.row.unknown .big{font-size:20px;color:var(--muted)}
.row.closed{opacity:.55}
.row.closed .big{font-size:20px;color:var(--muted)}
.shop{font-size:13px;font-weight:700;color:var(--muted)}
.product{font-size:17px;font-weight:700;line-height:1.4;margin:2px 0 6px}
.dates{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--surface)}
.chip.m-online{background:#E6F0FB;border-color:#B9D4F1;color:#0A4A95}
.chip.m-store{background:#E6F4EC;border-color:#B6DCC5;color:#17613F}
.chip.check{background:#FFF4EC;border-color:#F0C4A6;color:#8C3A07}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:8px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--action);background:var(--surface);color:var(--action)}
.btn.primary{background:var(--action);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:500;min-height:36px;padding:0 10px;font-size:13px}
.applied{font-size:14px;font-weight:700;color:#17613F}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.empty{padding:40px 0;color:var(--muted);text-align:center}
footer{padding:28px 0 48px;font-size:12px;color:var(--muted)}
.chip.warn{background:#FFF1E0;border-color:#F0B77A;color:#8C3A07;font-weight:700}
.chip.ok{background:#E6F4EC;border-color:#B6DCC5;color:#17613F}
.chip.mute{color:var(--muted)}
.need{margin:8px 0;padding:8px 10px;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;font-size:13px}
.need b{display:block;margin-bottom:2px}
.need ul,.steps{margin:0;padding-left:20px}
.need li.no{color:var(--urgent);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:4px 0}
.note.warn{color:#8C3A07}
.prof{margin:12px 0 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px}
.prof summary{cursor:pointer;font-weight:700;min-height:32px}
.prof label{display:flex;gap:8px;align-items:center;min-height:36px}
.prof input{width:18px;height:18px}
@media (max-width:420px){
  .row{grid-template-columns:78px 1fr;gap:0 10px}
  .time .big{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ポケカ抽選・予約情報</h1>
    <p class="lead">店舗の公式告知から集めています。応募の前に、必ず告知の原文で条件を確認してください。</p>
    <div class="meta" id="updated"></div>
    <div class="notice" id="sampleNotice" hidden>表示中のデータは動作確認用のサンプルです。実際の抽選情報ではありません。</div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" role="group" aria-label="受付方法">
      <button class="tab" data-method="all" aria-pressed="true" type="button">すべて</button>
      <button class="tab" data-method="online" aria-pressed="false" type="button">オンライン</button>
      <button class="tab" data-method="store" aria-pressed="false" type="button">店頭</button>
    </div>
    <div class="opts">
      <label for="sort">並び順
        <select id="sort">
          <option value="end">締切が近い順</option>
          <option value="result">当選発表が近い順</option>
          <option value="new">新着順</option>
        </select>
      </label>
      <label><input type="checkbox" id="showUnknown" checked>締切の確認中も表示</label>
      <label><input type="checkbox" id="showClosed">終了したものも表示</label>
      <label><input type="checkbox" id="onlyOk">条件を満たすものだけ</label>
    </div>
  </div>
</div>

<main class="wrap">
  <details class="prof" id="prof"><summary>持っているカード・会員を登録(応募できるか自動で判定)</summary><div id="profList"></div><p class="note">この設定は、お使いの端末のブラウザにだけ保存されます。</p></details>
  <div class="count" id="count" aria-live="polite"></div>
  <ul class="list" id="list"></ul>
</main>

<footer class="wrap">
  <p>掲載内容は店舗の告知をもとにしており、正確性を保証するものではありません。最新の条件は各店舗の告知をご確認ください。「応募した」の記録は、お使いの端末のブラウザにだけ保存されます。</p>
</footer>

<script>
(function(){
  'use strict';
  var TZ = 'Asia/Tokyo';
  var dtf = new Intl.DateTimeFormat('ja-JP', {timeZone: TZ, month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false});
  var KEY = 'pokeka-applied:';
  var mem = {};
  var state = {items: [], method: 'all', showClosed: false, showUnknown: true, sort: 'end', onlyOk: false, error: false};
  var groupApplied = {};

  function fmt(v){ return v ? dtf.format(new Date(v)) : null; }
  function ts(v){ return v ? new Date(v).getTime() : null; }
  function h(tag, cls, text){
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined && text !== null) el.textContent = text;
    return el;
  }
  function safeUrl(u){
    try { var x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; }
    catch(e){ return null; }
  }

  function getApplied(id){
    try { var v = localStorage.getItem(KEY + id); if (v) return v; } catch(e){}
    return mem[id] || null;
  }
  function setApplied(id, v){
    if (v) mem[id] = v; else delete mem[id];
    try { if (v) localStorage.setItem(KEY + id, v); else localStorage.removeItem(KEY + id); } catch(e){}
  }

  var PROFILE_OPTIONS = [
    {key: 'mynumber_card', label: '本人名義のマイナンバーカード'},
    {key: 'aeon_card', label: 'イオンカード(自分名義のクレジット)'},
    {key: 'biccamera_card', label: 'ビックカメラのポイントカード/公式アプリ(登録済)'},
    {key: 'yodobashi_member', label: 'ヨドバシ・ドット・コム会員'}
  ];
  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('pokeka-profile') || '{}') || {}; } catch(e){ profile = {}; }
  function saveProfile(){ try { localStorage.setItem('pokeka-profile', JSON.stringify(profile)); } catch(e){} }
  function reqStatus(it){
    var all = it.requirements || [], miss = [], chk = [];
    all.forEach(function(q){
      var known = PROFILE_OPTIONS.some(function(o){ return o.key === q.key; });
      if (!known) chk.push(q); else if (!profile[q.key]) miss.push(q);
    });
    return {all: all, miss: miss, chk: chk};
  }

  function stateOf(it, now){
    var s = ts(it.entry_start), e = ts(it.entry_end);
    if (it.status === 'closed' || (e !== null && now > e)) return 'closed';
    if (s !== null && now < s) return 'upcoming';
    if (e !== null) return 'open';
    return 'unknown';
  }

  function parts(ms){
    var m = Math.max(0, Math.floor(ms / 60000));
    var d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mi = m % 60;
    if (m >= 2880) return {n: d, u: '日', sub: hh + '時間'};
    if (m >= 60) return {n: Math.floor(m / 60), u: '時間', sub: mi + '分'};
    return {n: m, u: '分', sub: ''};
  }

  function sortKey(it, st){
    var s = ts(it.entry_start), e = ts(it.entry_end);
    if (state.sort === 'new') return -(ts(it.first_seen_at) || 0);
    if (state.sort === 'result') return ts(it.result_date) === null ? Infinity : ts(it.result_date);
    if (st === 'open') return e;
    if (st === 'upcoming') return s;
    return Infinity;
  }

  function buildRow(it, st, now){
    var s = ts(it.entry_start), e = ts(it.entry_end);
    var cls = 'row ' + st;
    var t = h('div', 'time');
    if (st === 'open' || st === 'upcoming'){
      var target = st === 'open' ? e : s;
      var ms = target - now;
      var p = parts(ms);
      if (st === 'open'){
        if (ms < 6 * 3600000) cls += ' urgent';
        else if (ms < 48 * 3600000) cls += ' soon';
      }
      t.appendChild(h('div', 'lab', st === 'open' ? '締切まで' : '受付開始まで'));
      var big = h('div', 'big', String(p.n));
      big.appendChild(h('span', 'unit', p.u));
      t.appendChild(big);
      if (p.sub) t.appendChild(h('div', 'sub', 'あと' + p.sub));
    } else if (st === 'unknown'){
      t.appendChild(h('div', 'lab', '締切'));
      t.appendChild(h('div', 'big', '確認中'));
    } else {
      t.appendChild(h('div', 'lab', '受付'));
      t.appendChild(h('div', 'big', '終了'));
    }

    var b = h('div', 'body');
    b.appendChild(h('div', 'shop', it.shop_name || it.shop_id));
    b.appendChild(h('div', 'product', it.product));

    var period = '受付 ' + (fmt(it.entry_start) || '未定') + ' 〜 ' + (fmt(it.entry_end) || '未定');
    b.appendChild(h('div', 'dates', period));
    var chMap = {email: 'メール', dm: 'DM', poster: '店頭掲示', app: 'アプリ通知', x_post: '店舗Xの投稿'};
    var ann = it.announce || {};
    if (it.result_date) b.appendChild(h('div', 'dates', '当選発表 ' + fmt(it.result_date) + (chMap[ann.channel] ? '(' + chMap[ann.channel] + (ann.no_inquiry ? '・問い合わせ不可' : '') + ')' : '')));
    if (it.purchase_start || it.purchase_end) b.appendChild(h('div', 'dates', '購入期間 ' + (fmt(it.purchase_start) || '未定') + ' 〜 ' + (fmt(it.purchase_end) || '未定')));

    var chips = h('div', 'chips');
    if (it.method === 'online') chips.appendChild(h('span', 'chip m-online', 'オンライン'));
    else if (it.method === 'store') chips.appendChild(h('span', 'chip m-store', '店頭'));
    if (it.limit_per_person) chips.appendChild(h('span', 'chip', '1人' + it.limit_per_person + '点まで'));
    if (it.price_yen) chips.appendChild(h('span', 'chip', '¥' + Number(it.price_yen).toLocaleString('ja-JP')));
    if (it.review_needed) chips.appendChild(h('span', 'chip check', '内容を確認中'));
    if (it.source_grade === 'third_party') chips.appendChild(h('span', 'chip check', '出典:第三者の投稿'));
    if (it.win_rate_ref && it.win_rate_ref.text) chips.appendChild(h('span', 'chip mute', '当選率の参考値 ' + it.win_rate_ref.text));
    var pay = it.payment || {};
    if (pay.restriction === 'own_card_only') chips.insertBefore(h('span', 'chip warn', '支払い:' + (pay.required_card || '指定カード') + 'のみ'), chips.firstChild);
    else if (pay.restriction === 'unknown') chips.appendChild(h('span', 'chip mute', '支払い条件:未確認'));
    var rs = reqStatus(it);
    if (rs.all.length){
      if (rs.miss.length) chips.appendChild(h('span', 'chip warn', '未登録の条件 ' + rs.miss.length + '件'));
      else if (rs.chk.length) chips.appendChild(h('span', 'chip mute', '要確認 ' + rs.chk.length + '件'));
      else chips.appendChild(h('span', 'chip ok', '条件を満たしています'));
    }
    if (chips.childNodes.length) b.appendChild(chips);
    if (rs.all.length){
      var need = h('div', 'need');
      need.appendChild(h('b', null, '応募前に必要なもの'));
      var ul = h('ul');
      rs.all.forEach(function(q){
        var miss = rs.miss.indexOf(q) >= 0;
        ul.appendChild(h('li', miss ? 'no' : '', (miss ? '未登録: ' : '') + q.label + (q.detail ? '(' + q.detail + ')' : '')));
      });
      need.appendChild(ul);
      b.appendChild(need);
    }
    var steps = it.entry_steps || [];
    if (steps.length){
      var sb = h('div', 'need');
      sb.appendChild(h('b', null, '応募の手順'));
      var ol = h('ol', 'steps');
      steps.forEach(function(x){ ol.appendChild(h('li', null, x.label)); });
      sb.appendChild(ol);
      b.appendChild(sb);
    }
    var notes = [];
    if (it.may_close_early) notes.push(['warn', '状況により受付を早く締め切る場合があります']);
    if (it.proof_note) notes.push(['', it.proof_note]);
    if (it.shrink === 'removed') notes.push(['', 'シュリンク・外箱は店舗が回収します']);
    if (it.penalty_note) notes.push(['warn', it.penalty_note]);
    if (it.exclusive_group){
      if (groupApplied[it.exclusive_group] && groupApplied[it.exclusive_group] !== it.id) notes.push(['warn', '同じグループの別の店舗に応募済みです(応募できるのは1店舗のみ)']);
      else notes.push(['warn', '複数店舗で実施されても、応募できるのは1店舗のみです']);
    }
    notes.forEach(function(n){ b.appendChild(h('div', 'note ' + n[0], n[1])); });

    var act = h('div', 'actions');
    var url = safeUrl(it.source_url);
    if (url){
      var a = h('a', 'btn primary', '告知を開く');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      act.appendChild(a);
    }
    if (st !== 'closed'){
      var applied = getApplied(it.id);
      if (applied){
        act.appendChild(h('span', 'applied', '応募済 ' + fmt(applied)));
        var undo = h('button', 'btn quiet', '取り消す');
        undo.type = 'button';
        undo.addEventListener('click', function(){ setApplied(it.id, null); render(); });
        act.appendChild(undo);
        var memo = getApplied('memo:' + it.id);
        var mb = h('button', 'btn quiet', memo ? '番号:' + memo : '抽選番号を記録');
        mb.type = 'button';
        mb.addEventListener('click', function(){
          var v = window.prompt('抽選番号やレシートの控え番号をメモ', memo || '');
          if (v !== null){ setApplied('memo:' + it.id, v.trim() || null); render(); }
        });
        act.appendChild(mb);
      } else {
        var mark = h('button', 'btn', '応募した');
        mark.type = 'button';
        mark.addEventListener('click', function(){ setApplied(it.id, new Date().toISOString()); render(); });
        act.appendChild(mark);
      }
    }
    b.appendChild(act);

    var li = h('li', cls);
    li.appendChild(t);
    li.appendChild(b);
    return li;
  }

  function render(){
    var now = Date.now();
    groupApplied = {};
    state.items.forEach(function(it){ if (it.exclusive_group && getApplied(it.id)) groupApplied[it.exclusive_group] = it.id; });
    var list = document.getElementById('list');
    var count = document.getElementById('count');
    list.textContent = '';

    if (state.error){
      list.appendChild(h('li', 'empty', 'データを読み込めませんでした。時間をおいて、もう一度開いてください。'));
      count.textContent = '';
      return;
    }

    var rows = [];
    state.items.forEach(function(it){
      var st = stateOf(it, now);
      if (state.method !== 'all' && it.method !== state.method) return;
      if (st === 'closed' && !state.showClosed) return;
      if (st === 'unknown' && !state.showUnknown) return;
      if (state.onlyOk && reqStatus(it).miss.length) return;
      rows.push({it: it, st: st});
    });

    var order = {open: 0, upcoming: 1, unknown: 2, closed: 3};
    rows.sort(function(a, b){
      if (state.sort === 'end' && order[a.st] !== order[b.st]) return order[a.st] - order[b.st];
      var ka = sortKey(a.it, a.st), kb = sortKey(b.it, b.st);
      if (ka === kb) return 0;
      return ka < kb ? -1 : 1;
    });

    var openCount = rows.filter(function(r){ return r.st === 'open'; }).length;
    count.textContent = rows.length + '件を表示(受付中 ' + openCount + '件)';

    if (!rows.length){
      list.appendChild(h('li', 'empty', '表示できる抽選はありません。受付方法の切り替えや、「終了したものも表示」を試してください。'));
      return;
    }
    rows.forEach(function(r){ list.appendChild(buildRow(r.it, r.st, now)); });
  }

  function setUpdated(){
    var latest = 0;
    state.items.forEach(function(it){
      latest = Math.max(latest, ts(it.last_verified_at) || 0, ts(it.first_seen_at) || 0);
    });
    document.getElementById('updated').textContent = latest ? 'データ更新 ' + fmt(latest) : '';
    var sample = state.items.some(function(it){ return /^sample/.test(String(it.id)); });
    document.getElementById('sampleNotice').hidden = !sample;
  }

  function bind(){
    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.method = btn.getAttribute('data-method');
        document.querySelectorAll('.tab').forEach(function(o){ o.setAttribute('aria-pressed', String(o === btn)); });
        render();
      });
    });
    document.getElementById('sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });
    document.getElementById('showUnknown').addEventListener('change', function(e){ state.showUnknown = e.target.checked; render(); });
    document.getElementById('showClosed').addEventListener('change', function(e){ state.showClosed = e.target.checked; render(); });
    document.getElementById('onlyOk').addEventListener('change', function(e){ state.onlyOk = e.target.checked; render(); });
    var pl = document.getElementById('profList');
    PROFILE_OPTIONS.forEach(function(o){
      var lab = h('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!profile[o.key];
      cb.addEventListener('change', function(){ profile[o.key] = cb.checked; saveProfile(); render(); });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(o.label));
      pl.appendChild(lab);
    });
  }

  function load(){
    fetch('data/lotteries.json', {cache: 'no-store'})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){ state.items = Array.isArray(data) ? data : []; setUpdated(); render(); })
      .catch(function(){ state.error = true; render(); });
  }

  bind();
  load();
  setInterval(render, 60000);
})();
</script>
<noscript><div class="wrap"><p class="empty">このページの表示にはJavaScriptが必要です。</p></div></noscript>
</body>
</html>
